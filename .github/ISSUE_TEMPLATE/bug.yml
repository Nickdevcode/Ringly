name: Bug report
description: Something is not working as expected
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please run `ringly doctor` and paste the output below so we can diagnose quickly.

  - type: input
    id: ringly-version
    attributes:
      label: Ringly version
      description: Run `ringly --version`
      placeholder: "0.1.1"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 23H2 / Windows 10 22H2"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "v22.14.0"
    validations:
      required: true

  - type: textarea
    id: doctor-output
    attributes:
      label: `ringly doctor` output
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Enable `debug: true` in the plugin config and paste the latest entries from the log file shown at the end of `ringly doctor`.
      render: text
