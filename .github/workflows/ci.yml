name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - name: Configure git to keep LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        env:
          RINGLY_SKIP_PREPARE: "1"
        run: npm ci

      - name: Diagnostic info
        shell: bash
        run: |
          echo "::group::Environment"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "OS: ${{ matrix.os }}"
          echo "PWD: $(pwd)"
          echo "::endgroup::"
          echo "::group::Biome version"
          npx biome --version
          echo "::endgroup::"
          echo "::group::Files biome will lint"
          find src test bin scripts -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.mjs" -o -name "*.js" -o -name "*.json" \) | sort
          echo "::endgroup::"
          echo "::group::Line endings sample"
          head -c 200 src/cli.ts | od -c | head -3
          head -c 200 src/core/types.ts | od -c | head -3
          echo "::endgroup::"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generated dispatch data is up to date
        shell: bash
        run: |
          # `npm run build` regenerates plugin/hooks/dispatch.data.mjs and
          # hooks.json from the event registry. If the committed copies drift
          # from a fresh build, fail — the registry is the single source of
          # truth and the generated files must be committed in sync.
          git diff --exit-code -- plugin/hooks/dispatch.data.mjs plugin/hooks/hooks.json \
            || (echo "::error::Generated dispatch files are stale. Run 'npm run build' and commit the result." && exit 1)

      - name: Smoke check bundle entries
        shell: bash
        run: |
          test -f dist/cli.cjs
          test -f dist/cli.js
          test -f dist/hook.cjs
          test -f dist/hook.js
          test -f dist/cli.d.ts
          test -f dist/hook.d.ts

      - name: Smoke run CLI bundle
        shell: bash
        run: |
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null

      - name: Smoke run hook bundle
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo '{"hook_event_name":"Stop","cwd":"/tmp"}' | node dist/hook.js Stop
